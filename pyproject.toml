[project]
name = "doom"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gymnasium[other]>=1.2.3",
    "mamba-ssm[causal-conv1d]>=2.2.6.post3",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "tqdm>=4.66.5",
    "vizdoom>=1.3.0.dev3",
]

[tool.uv]
no-build-isolation-package = ["mamba-ssm", "causal-conv1d"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu130"
default = false

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
]

# ruff configuration
[tool.ruff]
line-length = 88
select = ["E", "F", "W", "C90", "B", "I", "Q0", "ANN", "S"]
ignore = ["E501", "F403", "F401", "E203"]
exclude = ["__init__.py"]
per-file-ignores = { "__init__.py" = ["F401"] }
